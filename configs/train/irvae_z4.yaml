logdir: results/retargeted_grasps/irvae
logging:
  backend: wandb
wandb:
  project: dexterous-hand-retargeting
logger:
  type: base
  endwith: []
model:
  arch: irvae
  encoder:
    arch: fc_vec
    l_hidden: [1024, 512, 256]
    activation: [relu, relu, relu]
    out_activation: linear
  decoder:
    arch: fc_vec
    l_hidden: [1024, 512, 256]
    activation: [relu, relu, relu]
    out_activation: linear
  x_dim: 20
  z_dim: 4
  iso_reg: 100.0
  metric: identity
data:
  training:
    dataset: RetargetedGraspQpos
    dataset_path: assets/datasets/retargeted_grasps_test
    batch_size: 32
    n_workers: 0
    split: training
    split_ratio: 0.9
    shuffle: true
    seed: 0
  validation:
    dataset: RetargetedGraspQpos
    dataset_path: assets/datasets/retargeted_grasps_test
    batch_size: 32
    n_workers: 0
    split: validation
    split_ratio: 0.9
    shuffle: false
    seed: 0
trainer: base
training:
  seed: 0
  n_epoch: 3000
  optimizer:
    name: adam
    lr: 0.00004
  print_interval: 50
  val_interval: 50
  visualize_interval: 1000000000
