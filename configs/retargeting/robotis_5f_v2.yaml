  # "save_default_pose_to_json" button writes here, and dataset generation reads it back.
  default_reference_pose_path: assets/robots/robotis_5f_hand_v2/default_reference_pose.json
  retargeting:
    type: joint
    urdf_path: assets/robots/robotis_5f_hand_v2/robotis_5f_hand_v2.urdf

