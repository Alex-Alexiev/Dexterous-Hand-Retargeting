custom_hand_retargeting:
  mapping_path: assets/robots/robotis_5f_hand_v2/robotis_5f_right_mano_link_mapping.json
  mapping_output_path: assets/robots/robotis_5f_hand_v2/robotis_5f_right_mano_link_mapping_output.json
